<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Serious Question</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe6e6; /* Cute pink background */
            margin: 0;
            overflow: hidden; /* Stops scrollbars from appearing when button gets huge */
        }
        h1 {
            color: #d32f2f;
            margin-bottom: 20px;
            font-size: 3rem;
            text-align: center;
        }
        .gif-container {
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #yesBtn {
            background-color: #4CAF50; /* Green */
            color: white;
            font-weight: bold;
        }
        #noBtn {
            background-color: #f44336; /* Red */
            color: white;
        }
    </style>
</head>
<body>

    <div class="gif-container">
        <img src="shrek.gif" alt="Shrek's Kiss" style="width: 200px; border-radius: 10px;">
    </div>

    <h1>Hi Moati, can you be Shrek this valentine?</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <button id="noBtn" onclick="growYes()">No</button>
    </div>

    <script>
        let yesSize = 1.2; // Initial font size in rem
        let yesPadding = 15; // Initial padding
        let messageIndex = 0; 

        // Define the messages OUTSIDE the function so the computer remembers them
        const messages = [
            "Are you sure?", 
            "Sach Mai?", 
            "Come on Mochiii!", 
            "Hay buhayyy", 
            "Why r u gay?", 
            "Stop being gay", 
            "Block me everywhere now", 
            "Mayank said this will work!!", 
            "I'm calling the police", 
            "I knew you were racist", 
            "I'll tell everyone you snore", 
            "Think of the children (we don't have)", 
            "I'm running out of ideas wahaha", 
            "How many times u pressing NO??", 
            "JUST PRESS YES ALREADY"
        ];

        function growYes() {
            // Increase size
            yesSize += 1.5; 
            yesPadding += 10;
            
            const yesBtn = document.getElementById("yesBtn");
            yesBtn.style.fontSize = yesSize + "rem";
            yesBtn.style.padding = yesPadding + "px " + (yesPadding * 2) + "px";

            // Change the No button text
            const noBtn = document.getElementById("noBtn");

            if (messageIndex < messages.length) {
                // Go through the list in order
                noBtn.innerText = messages[messageIndex];
                messageIndex++;
            } else {
                // Once the list is done, pick a random one
                noBtn.innerText = messages[Math.floor(Math.random() * messages.length)];
            }
        }

        function sayYes() {
            document.body.innerHTML = "<h1 style='font-size: 4rem; color: #d32f2f;'>YAY! See you on the 13th! ❤️</h1> (Let's go out on Friday evening instead bc I need to go home early on the 14th wahaha)";
        }
    </script>

</body>
</html>
