<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Very Serious Question</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffe6e6; /* Cute pink background */
            margin: 0;
            overflow: hidden; /* Stops scrollbars from appearing when button gets huge */
        }
        h1 {
            color: #d32f2f;
            margin-bottom: 20px;
            font-size: 3rem;
            text-align: center;
        }
        .gif-container {
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #yesBtn {
            background-color: #4CAF50; /* Green */
            color: white;
            font-weight: bold;
        }
        #noBtn {
            background-color: #f44336; /* Red */
            color: white;
        }
    </style>
</head>
<body>

    <div class="gif-container">
        <img src="shrek.gif" alt="Shrek's Kiss" style="width: 200px; border-radius: 10px;">
    </div>

    <h1>Hi Moati, can you replace Shrek this valentine?</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <button id="noBtn" onclick="growYes()">No</button>
    </div>

    <script>
        let yesSize = 1.2; // Initial font size in rem
        let yesPadding = 15; // Initial padding

        function growYes() {
            // Increase size
            yesSize += 1.5; 
            yesPadding += 10;
            
            const yesBtn = document.getElementById("yesBtn");
            yesBtn.style.fontSize = yesSize + "rem";
            yesBtn.style.padding = yesPadding + "px " + (yesPadding * 2) + "px";

            // Make the No button text change for fun
            const messages = ["Are you sure?", "Really?", "Come on Mochiii!", "Hay nako", "Don't do this!", "Hay buhay..."];
            const noBtn = document.getElementById("noBtn");
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            noBtn.innerText = randomMessage;
        }

        function sayYes() {
            // 1. Send the email notification
            fetch("https://formsubmit.co/ajax/christopher.jeff.sanchez@eee.upd.edu.ph", {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    message: "MOATI SAID YES! 🎉 Time to plan the date."
                })
            })
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.log(error));
            document.body.innerHTML = "<h1 style='font-size: 4rem; color: #d32f2f;'>YAY! See you on the 13th! ❤️</h1> (Let's go out on Friday evening instead bc I need to go home early on the 14th wahaha)";
        }
    </script>

</body>
</html>
